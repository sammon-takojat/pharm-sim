apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag", "name":"pharma-sim:staging", "namespace":"excaperoom-ohtu-s2026"},"fieldPath":"spec.template.spec.containers[?(@.name==\"pharma-sim\")].image","pause":"false"}]
  name: pharma-sim-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharma-sim
  template:
    metadata:
      labels:
        app: pharma-sim
    spec:
      containers:
        - name: pharma-sim
          image: dominicnygard/pharm-sim
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "50Mi"
              cpu: "50m"
