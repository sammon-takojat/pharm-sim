name: Deploy Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  export-web:
    name: Build Web Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
              xvfb \
              libfontconfig1 \
              libxcursor1 \
              libwayland-cursor0 \
              libxkbcommon0 \
              libxinerama1 \
              libxi6

      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/

          mv \
              /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Disable test addon
        run: |
          rm -rf addons/gdUnit4

      - name: Web Build
        run: |
          mkdir -p WebDeploy/build

          godot \
              --headless \
              --verbose \
              --export-release \
              "Web" \
              "WebDeploy/build/index.html"

      - name: Upload Web export
        uses: actions/upload-artifact@v7
        with:
          name: web-export
          path: WebDeploy

  release:
    name: Build and Push Release
    needs: export-web
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION"
            exit 1
          fi

          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make sure Git tag doesn't already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Git tag $VERSION already exists."
              exit 1
          fi

      - name: Download Web export
        uses: actions/download-artifact@v5
        with:
          name: web-export
          path: WebDeploy

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: WebDeploy
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/pharm-sim:release
            ${{ vars.DOCKERHUB_USERNAME }}/pharm-sim:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/pharm-sim:sha-${{ github.sha }}

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"
